<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos de la cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <main class="container py-4" style="max-width: 860px">
      <h1 class="h3 mb-4">Gestión de pedidos de la cafetería</h1>

      <form id="formPedido" class="card card-body mb-4" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="inputProducto" class="form-label">Producto</label>
            <input type="text" id="inputProducto" class="form-control" placeholder="Café americano" required />
            <div class="invalid-feedback" id="errorProducto"></div>
          </div>
          <div class="col-6 col-md-3">
            <label for="inputPrecio" class="form-label">Precio unitario ($)</label>
            <input type="number" id="inputPrecio" class="form-control" step="0.01" placeholder="2.50" required />
            <div class="invalid-feedback" id="errorPrecio"></div>
          </div>
          <div class="col-6 col-md-3">
            <label for="inputCantidad" class="form-label">Cantidad</label>
            <input type="number" id="inputCantidad" class="form-control" step="1" placeholder="3" required />
            <div class="invalid-feedback" id="errorCantidad"></div>
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" id="btnAgregar" class="btn btn-primary">Agregar pedido</button>
        </div>
      </form>

      <div class="row g-2 align-items-start mb-3">
        <div class="col-sm-4">
          <input type="number" id="inputPrecioMaximo" class="form-control" step="0.01" placeholder="Precio máximo" aria-label="Precio máximo" />
          <div class="invalid-feedback" id="errorPrecioMaximo"></div>
        </div>
        <div class="col-sm-8 d-flex flex-wrap gap-2">
          <button type="button" id="btnFiltrar" class="btn btn-outline-primary">Filtrar productos</button>
          <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
          <button type="button" id="btnLimpiar" class="btn btn-outline-danger ms-sm-auto">Limpiar pedidos</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered bg-white align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col">Producto</th>
              <th scope="col" class="text-end">Precio unitario</th>
              <th scope="col" class="text-end">Cantidad</th>
              <th scope="col" class="text-end">Subtotal</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between flex-wrap gap-2 fw-semibold">
        <span>Total de unidades: <span id="totalUnidades">0</span></span>
        <span>Monto total: <span id="montoTotal">$0.00</span></span>
      </div>

      <a href="../index.html" class="d-inline-block mt-4">Regresar</a>
    </main>
  </body>
</html>
